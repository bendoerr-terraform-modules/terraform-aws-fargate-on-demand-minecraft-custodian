name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Compile first so probing starts immediately after Paper does; the test requires observing boot.
      - name: Build integration test
        run: go test -c -tags integration -o mcjava.test ./internal/watcher/mcjava/

      - name: Start Paper
        run: >-
          docker run -d --name paper -p 25565:25565
          -e EULA=TRUE -e TYPE=PAPER -e VERSION=26.2 -e MEMORY=1G
          itzg/minecraft-server:java25

      - name: Probe Paper
        env:
          CUSTODIAN_IT_MC_ADDR: 127.0.0.1:25565
        run: ./mcjava.test -test.run TestProbeAgainstPaper -test.v -test.timeout 15m

      - name: Paper logs
        if: failure()
        run: docker logs paper
